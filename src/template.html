<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crockpot Recipes</title>
<style>
/*STYLES*/
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand"><h1>Crockpot Recipes</h1>
      <button class="chip fav-filter" id="favOnly" aria-pressed="false">★ Favorites</button></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search recipes or ingredients" autocomplete="off" aria-label="Search recipes">
      <button class="clear" id="clear" aria-label="Clear search" hidden>×</button>
    </div>
    <div class="controls">
      <div class="chips" id="sectionChips" role="group" aria-label="Section"></div>
      <div class="chips" id="proteinChips" role="group" aria-label="Protein"></div>
      <div class="chips" id="tagChips" role="group" aria-label="Rice or pasta"></div>
      <label class="sort"><span class="sort-label">Sort</span>
        <select id="sort">
          <option value="book">Book order</option>
          <option value="title">A–Z</option>
          <option value="cal-asc">Calories (low → high)</option>
          <option value="pro-desc">Protein (high → low)</option>
          <option value="ratio">Protein per calorie</option>
        </select>
      </label>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="list">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="detail" class="detail" hidden></section>
</main>

<script id="recipe-data" type="application/json">/*RECIPES_JSON*/</script>
<script>
/*APP_JS*/
</script>
</body>
</html>
